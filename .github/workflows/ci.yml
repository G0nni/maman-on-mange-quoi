name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Tests unitaires
        run: npm test
      - name: Validation des recettes
        run: npm run validate:recipes
      - name: Build
        run: npm run build

  rules:
    name: Règles Firestore
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOOLS_VERSION: 15.30.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Installer firebase-tools
        run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}
      # Le jar de l'émulateur Firestore est téléchargé au premier lancement : on le garde en cache.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ env.FIREBASE_TOOLS_VERSION }}
      - name: Tests des Security Rules (émulateur, projet fictif demo-mmq)
        run: npm run test:rules
